# Sol's AuthLogin System Configuration - Servidor Limbo Cobblemon
[general]

	[general.timeout]
		# Segundos antes de desconectar quem nao fizer login (0 = desativado)
		loginTimeoutSeconds = 90
		# Segundos de espera pos-login
		gracePeriodSeconds = 1
		# Cache por IP desativado (0) para evitar compartilhamento de IP em tuneis/proxies
		sessionCacheMinutes = 0

	[general.security]
		maxLoginAttempts = 5
		lockoutTimeSeconds = 120
		minPasswordLength = 4
		maxPasswordLength = 32
		requireSpecialChar = false
		requireNumber = false
		# IMPORTANTE: Falso para exigir token criptografico individual por PC ou senha, nunca apenas IP
		enableSessionCache = false
		kickOnLockout = true
		preventMultipleLogins = true
		requireClientMod = true
		enableInSingleplayer = false

	[general.spawn]
		teleportToSpawn = false
		teleportBackAfterLogin = false
		useWorldSpawn = true
		customSpawnX = 0
		customSpawnY = 100
		customSpawnZ = 0

	[general.notifications]
		reminderIntervalSeconds = 10
		showTitleReminders = true
		showActionBarReminders = true

